# One-shot chain: when tonight's full 200-mile scan (run 33567469601) finishes
# successfully, dispatch a light run so the upgraded board UI deploys with the
# fresh data immediately instead of waiting for the 4 AM cron.
# (workflow_dispatch via GITHUB_TOKEN is one of the two events allowed to
# start new runs, so this does not cascade.) Safe to delete after it fires.
name: Deploy new UI after full scan

on:
  workflow_run:
    workflows: ["Monthly lead rescan"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  chain:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.id == 33567469601
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch light run (new UI + cached 200-mile data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run rescan.yml -R ${{ github.repository }} -f mode=light
