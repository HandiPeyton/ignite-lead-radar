name: Deploy new UI after tonight's full run
# One-shot chain: when the pinned full run succeeds, dispatch a light run so the
# board template pushed mid-run (9–5 schedule) ships with the fresh data.
on:
  workflow_run:
    workflows: ["Monthly lead rescan"]
    types: [completed]
permissions:
  actions: write
jobs:
  chain:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.id == 33578033199
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run rescan.yml -R "$GITHUB_REPOSITORY" -f mode=light
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
