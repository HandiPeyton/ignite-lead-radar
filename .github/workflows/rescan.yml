name: Monthly lead rescan

on:
  schedule:
    - cron: '30 9 * * 0'    # weekly FULL scan (re-enumerate OSM): Sundays ~5:30 AM ET
    - cron: '0 8 * * 1-6'   # daily LIGHT rescan Mon–Sat ~4 AM ET (8:00 UTC; 3 AM in winter — DST)
    - cron: '0 20 * * *'    # daily LIGHT rescan ~4 PM ET (20:00 UTC; 3 PM in winter — DST)
    # ONE-OFF full scan for Sept 3 around 2:00 AM ET, three staggered chances because GitHub's
    # cron can fire hours late; the dedupe guard cancels whichever ones fire after the first has
    # started. Remove all three after Sept 3.
    - cron: '30 5 3 9 *'    # 1:30 AM ET
    - cron: '0 6 3 9 *'     # 2:00 AM ET
    - cron: '45 6 3 9 *'    # 2:45 AM ET
  workflow_dispatch:        # manual runs (GitHub phone app works); pick the mode
    inputs:
      mode:
        description: 'full = re-enumerate OSM; light = re-audit only'
        type: choice
        options: [full, light]
        default: full

permissions:
  contents: read
  actions: write   # lets a late cron run cancel itself (dedupe guard)

# Never let two scans overlap (a delayed cron landing on top of a full run
# would double-hit Overpass and race the deploy) — later runs wait their turn.
concurrency:
  group: lead-rescan
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Scan data (inventory, leads, audits, ratings, deep metrics, places) lives
      # in the Actions cache, not in git — keeps the public repo code-only and
      # the lead database private. Rolling key: newest save wins.
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: radar-data-${{ github.run_id }}
          restore-keys: |
            radar-data-

      - name: Snapshot tracking state (backup + owner corrections)
        env:
          LEAD_BOARD_KEY: ${{ secrets.LEAD_BOARD_KEY }}
        run: |
          mkdir -p out
          curl -s -H "x-board-key: $LEAD_BOARD_KEY" https://ignite-lead-radar.netlify.app/api/state -o out/state-live.json

      # GitHub's cron can fire hours late. When an exact-time dispatch (Netlify scheduled
      # function) already started a run in the last two hours, a late cron must not run the
      # whole thing again — it cancels itself instead.
      - name: Skip a late cron if a run already started recently
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RECENT=$(gh run list -R ${{ github.repository }} -w "Monthly lead rescan" -L 10 --json databaseId,createdAt --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select((now - (.createdAt | fromdateiso8601)) < 7200)] | length')
          echo "runs started in the last 2 h (other than this one): $RECENT"
          if [ "$RECENT" != "0" ]; then echo "A run already started recently — cancelling this late cron."; gh run cancel ${{ github.run_id }} -R ${{ github.repository }}; sleep 30; fi

      - name: Decide scan mode
        id: mode
        run: |
          MODE=light
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "light" ]; then MODE=full; fi
          if [ "${{ github.event.schedule }}" = "30 9 * * 0" ]; then MODE=full; fi
          case "${{ github.event.schedule }}" in "30 5 3 9 *"|"0 6 3 9 *"|"45 6 3 9 *") MODE=full ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Scan mode: $MODE"

      - name: Scan every tile within 200 mi of Bristol (full enumeration)
        if: steps.mode.outputs.mode == 'full'
        run: node scan.mjs

      - name: Re-audit from last enumeration (light)
        if: steps.mode.outputs.mode == 'light'
        run: node scan.mjs --skip-enum

      - name: Guard — refuse to ship a stale scan
        run: |
          node -e "
            const s = require('./out/summary.json');
            const ageMin = (Date.now() - Date.parse(s.ranAt)) / 60000;
            if (!(ageMin >= 0 && ageMin < 120)) {
              console.error('summary.json is ' + ageMin.toFixed(0) + ' min old — the scan did not write fresh output. Failing the run.');
              process.exit(1);
            }
            console.log('fresh scan confirmed:', s.ranAt, '(' + s.totalLeads + ' leads)');
          "

      - name: Deep audit (TLS / SPF / DMARC / SEO)
        run: node audit-deep.mjs

      - name: Google ratings (skips itself without the key)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node enrich-ratings.mjs

      - name: Foursquare verification fallback (skips itself without the key)
        env:
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
        run: node enrich-fsq.mjs

      - name: Overture Maps verification (open data; every run, cheap when nothing changed)
        continue-on-error: true   # verification is additive; never block the build + deploy
        run: |
          npm install --no-save --no-fund --no-audit duckdb
          node enrich-overture.mjs

      - name: Deep render scan + screenshots (weekly full only)
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true   # screenshots are a bonus; never let them block the build + deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install --no-save --no-fund --no-audit puppeteer @netlify/blobs
          node shots.mjs

      - name: Build checkup pages + board
        run: |
          node build-audits.mjs
          node build-board.mjs

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        working-directory: site
        run: |
          npm install --no-fund --no-audit
          npx netlify-cli deploy --prod --site 565e77e6-a859-4b59-aa14-c268aa57071c --no-build --dir public --functions functions

      - name: Save scan data to cache (feeds light runs + next-run diffing)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out
          key: radar-data-${{ github.run_id }}

      - name: Upload leads CSV + tracking backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-and-backup-${{ github.run_number }}
          path: |
            out/leads.csv
            out/state-live.json
          if-no-files-found: ignore
