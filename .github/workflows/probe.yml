name: Overpass mirror probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query every mirror from this runner
        run: |
          echo "runner egress IP: $(curl -s https://api.ipify.org)"
          Q='[out:json][timeout:25];node["amenity"="townhall"](36.5,-82.3,36.7,-82.1);out 1;'
          for EP in https://z.overpass-api.de/api/interpreter https://lz4.overpass-api.de/api/interpreter https://overpass.openstreetmap.fr/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            for UA in "IgniteLeadRadar/1.0" "curl/8.5.0"; do
              for M in POST GET; do
                if [ "$M" = POST ]; then R=$(curl -s -o /tmp/b -w "%{http_code} %{time_total}s" -m 40 -A "$UA" -H "Accept: application/json" --data-urlencode "data=$Q" "$EP" 2>&1 || echo "CONN-FAIL exit=$?");
                else R=$(curl -s -o /tmp/b -w "%{http_code} %{time_total}s" -m 40 -A "$UA" -H "Accept: application/json" -G --data-urlencode "data=$Q" "$EP" 2>&1 || echo "CONN-FAIL exit=$?"); fi
                printf '%-58s %-4s %-24s -> %s | %s\n' "$EP" "$M" "$UA" "$R" "$(head -c 90 /tmp/b | tr '\n' ' ')"
              done
            done
          done
